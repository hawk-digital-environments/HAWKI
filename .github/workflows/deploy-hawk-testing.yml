name: Deploy to Testing
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Testing instance to deploy (1, 2 or 3). Always deploys that instance''s hawk/test-N ref, regardless of the branch you run this workflow from.'
        required: true
        type: choice
        options: [ '1', '2', '3' ]
        default: '1'
  push:
    branches:
      - 'hawk/test-1'
      - 'hawk/test-2'
      - 'hawk/test-3'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.instance.outputs.number }}
    steps:
      - name: Determine testing instance number
        id: instance
        env:
          INSTANCE_INPUT: ${{ inputs.instance }}
        run: |
          # On a push to hawk/test-N the instance comes from the pushed
          # branch. On a manual dispatch the "Use workflow from" dropdown
          # only picks which workflow file runs and defaults to
          # development, so the instance must come from the input.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INSTANCE_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "number=${GITHUB_REF_NAME##*-}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: setup

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out the deploy ref
        uses: actions/checkout@v7
        with:
          # Always deploy the ref of this instance, no matter which ref the
          # workflow was dispatched from: the "Use workflow from" dropdown
          # of a manual run only picks which workflow file runs and
          # defaults to development, it does not pick the deployed code.
          ref: hawk/test-${{ needs.setup.outputs.number }}

      # github.sha belongs to the ref the workflow was dispatched from, not
      # to the instance ref, so resolve the actually checked-out commit for
      # the image tags and the cache buster below.
      - name: Resolve the deployed commit
        id: build_info
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=test-${{ needs.setup.outputs.number }}-${{ steps.build_info.outputs.head_sha }}
            type=raw,value=test-${{ needs.setup.outputs.number }}-latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          target: app_prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_BUSTER=${{ steps.build_info.outputs.head_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ setup, build-and-push ]
    steps:
      - name: Trigger Dokploy webhook
        run: curl -fsSL "${{ secrets[format('DOKPLOY_DEPLOYMENT_WEBHOOK_TEST_{0}', needs.setup.outputs.number)] }}"

  remove-old-images:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{github.repository_owner}}
          token: ${{secrets.GITHUB_TOKEN}}
          image-names: "hawki"
          image-tags: "test-${{ needs.setup.outputs.number }}-* !test-${{ needs.setup.outputs.number }}-latest"
          keep-n-most-recent: 5
          cut-off: 1h
