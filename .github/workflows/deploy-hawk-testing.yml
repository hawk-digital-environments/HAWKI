name: Deploy to Testing
on:
  workflow_dispatch:
  push:
    branches:
      - 'hawk/test-1'
      - 'hawk/test-2'
      - 'hawk/test-3'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.instance.outputs.number }}
    steps:
      - name: Determine testing instance number
        id: instance
        run: echo "number=${GITHUB_REF_NAME##*-}" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: setup

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=test-${{ needs.setup.outputs.number }}-${{ github.sha }}
            type=raw,value=test-${{ needs.setup.outputs.number }}-latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          target: app_prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_BUSTER=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [ setup, build-and-push ]
    steps:
      - name: Trigger Dokploy webhook
        run: curl -fsSL "${{ secrets[format('DOKPLOY_DEPLOYMENT_WEBHOOK_TEST_{0}', needs.setup.outputs.number)] }}"

  remove-old-images:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{github.repository_owner}}
          token: ${{secrets.GITHUB_TOKEN}}
          image-names: "hawki"
          image-tags: "test-${{ needs.setup.outputs.number }}-* !test-${{ needs.setup.outputs.number }}-latest"
          keep-n-most-recent: 5
          cut-off: 1h
