name: AI Compliance

on:
  pull_request:
    paths:
      - 'app/Services/Ai/**'
      - 'app/Http/Controllers/Api/V1/**'
      - 'routes/api.php'
      - 'tests/Feature/Api/Compliance/**'
      - 'tests/Feature/Api/Chat/**'
      - 'research/openresponses/**'
      - '.github/workflows/ai-compliance.yml'
  workflow_dispatch:

concurrency:
  group: ai-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-responses-compliance:
    name: Live compliance + wire-format suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, iconv, gd
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Both suites self-skip (green) when OPENRESPONSES_COMPLIANCE_TOKEN is empty;
      # with a populated repository secret they verify the proxy against the real
      # provider (gpt-4.1-nano / o4-mini): the Open Responses acceptance tests, the
      # Chat Completions live verification (chunk grammar, client-tool loop, params),
      # and the structured-output/reasoning-replay verification (N6).
      - name: Run live suites
        env:
          OPENRESPONSES_COMPLIANCE_TOKEN: ${{ secrets.OPENRESPONSES_COMPLIANCE_TOKEN }}
        run: php vendor/bin/phpunit --testsuite feature --no-coverage --testdox --filter 'OpenResponsesComplianceTest|ChatCompletionsLiveTest|StructuredOutputAndReasoningLiveTest'
