name: '[MANUAL] - Rebuild Existing Image'

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for the rebuild'
        required: true
        default: 'Hotfix for current version'

permissions:
  packages: write
  contents: read
  attestations: write
  id-token: write

jobs:
  build-and-publish:
    name: Rebuild & Publish
    runs-on: ubuntu-latest
    steps:
      # The "Use workflow from" selector of the workflow_dispatch form IS the
      # ref input: it selects the branch or tag this job rebuilds. Anything
      # but main or a release tag must be rejected here - the selector
      # defaults to development, whose version tags must never be
      # republished from an unreleased state.
      - name: Guard the dispatched ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] \
             && ! echo "$GITHUB_REF" | grep -Eq '^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Dispatch this workflow from 'main' or a release tag (e.g. 'refs/tags/2.5.2'), not '$GITHUB_REF_NAME'."
            exit 1
          fi
          echo "Rebuilding from: $GITHUB_REF"

      - name: Checkout repository
        uses: actions/checkout@v7
        # No ref: checks out the branch or tag selected in the
        # "Use workflow from" dropdown of the dispatch form.

      - name: Read version from config
        id: get_version
        uses: hawk-digital-environments/hawk-pipeline-actions/detect-version@v1
        with:
          strategy: version-json
          version-json: config/hawki_version.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Required to read the registry-backed build cache below
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          target: app_prod
          platforms: linux/amd64,linux/arm64
          # Only a dispatch from main may replace the latest image tag -
          # republishing anything older would regress it. The empty line
          # below is dropped by the action's list parser, which skips
          # empty lines.
          tags: |
            ${{ github.ref_name == 'main' && 'digitalenvironments/hawki:latest' || '' }}
            digitalenvironments/hawki:${{ steps.get_version.outputs.version }}
          # Imports the per-arch caches written by the release gate in
          # trigger-release.yml. A hotfix rebuild of main may only hit these
          # partially, which just means a slower build - never a failure.
          cache-from: |
            type=registry,ref=ghcr.io/hawk-digital-environments/hawki:buildcache-amd64
            type=registry,ref=ghcr.io/hawk-digital-environments/hawki:buildcache-arm64
          # No cache-to on purpose: exporting a combined multi-arch cache is
          # what triggered the 504s, and nothing reads such a ref anyway.

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/digitalenvironments/hawki
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: hawk-digital-environments/hawk-pipeline-actions/send-discord-notification@v1
        with:
          webhook-url: ${{ secrets.DISCORD_UPDATE_WEBHOOK_URL }}
          release-name: "Hotfix Rebuild: ${{ steps.get_version.outputs.version }}"
          release-body: "Manual rebuild triggering by workflow dispatch from '${{ github.ref_name }}' (${{ github.sha }}).${{ github.ref_name != 'main' && ' The digitalenvironments/hawki:latest tag was left untouched.' || '' }} Reason: ${{ inputs.reason }}"
          release-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          content: "||@everyone|| ⚠️ **HAWKI ${{ steps.get_version.outputs.version }}** has been rebuilt and republished (Hotfix, ref: ${{ github.ref_name }})."
