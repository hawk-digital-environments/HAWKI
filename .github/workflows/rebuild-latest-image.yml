name: Rebuild Latest Image

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for the rebuild'
        required: true
        default: 'Hotfix for current version'
      ref:
        description: 'Branch, tag or full commit SHA to rebuild from. Only a rebuild of the tip of main also replaces the latest tag.'
        required: true
        default: 'main'

permissions:
  packages: write
  contents: read
  attestations: write
  id-token: write

jobs:
  build-and-publish:
    name: Rebuild & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Rebuilding anything but main's tip must not replace the latest image
      # tag, otherwise republishing an older release would regress it.
      - name: Check whether this checkout is main's tip
        id: ref_info
        uses: hawk-digital-environments/hawk-pipeline-actions/check-branch-tip@v1
        with:
          branch: main

      - name: Read version from config
        id: get_version
        uses: hawk-digital-environments/hawk-pipeline-actions/detect-version@v1
        with:
          strategy: version-json
          version-json: config/hawki_version.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Required to read the registry-backed build cache below
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          target: app_prod
          platforms: linux/amd64,linux/arm64
          # The latest line renders empty for rebuilds of older refs and is
          # then dropped by the action's list parser, which skips empty lines.
          tags: |
            ${{ steps.ref_info.outputs.is-branch-tip == 'true' && 'digitalenvironments/hawki:latest' || '' }}
            digitalenvironments/hawki:${{ steps.get_version.outputs.version }}
          # Imports the per-arch caches written by the release gate in
          # trigger-release.yml. A hotfix rebuild of main may only hit these
          # partially, which just means a slower build - never a failure.
          cache-from: |
            type=registry,ref=ghcr.io/hawk-digital-environments/hawki:buildcache-amd64
            type=registry,ref=ghcr.io/hawk-digital-environments/hawki:buildcache-arm64
          # No cache-to on purpose: exporting a combined multi-arch cache is
          # what triggered the 504s, and nothing reads such a ref anyway.

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/digitalenvironments/hawki
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: hawk-digital-environments/hawk-pipeline-actions/send-discord-notification@v1
        with:
          webhook-url: ${{ secrets.DISCORD_UPDATE_WEBHOOK_URL }}
          release-name: "Hotfix Rebuild: ${{ steps.get_version.outputs.version }}"
          release-body: "Manual rebuild triggering by workflow dispatch from ref '${{ inputs.ref }}' (${{ steps.ref_info.outputs.head-sha }}).${{ steps.ref_info.outputs.is-branch-tip != 'true' && ' The digitalenvironments/hawki:latest tag was left untouched.' || '' }} Reason: ${{ inputs.reason }}"
          release-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          content: "||@everyone|| ⚠️ **HAWKI ${{ steps.get_version.outputs.version }}** has been rebuilt and republished (Hotfix, ref: ${{ inputs.ref }})."
