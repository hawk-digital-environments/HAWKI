name: Deploy to Production
on:
  workflow_dispatch:
  push:
    branches:
      - 'hawk/prod'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out the deploy ref
        uses: actions/checkout@v7
        with:
          # Always deploy hawk/prod, no matter which ref the workflow was
          # dispatched from: the "Use workflow from" dropdown of a manual
          # run only picks which workflow file runs and defaults to
          # development, it does not pick the deployed code.
          ref: hawk/prod

      # github.sha belongs to the ref the workflow was dispatched from, not
      # to hawk/prod, so resolve the actually checked-out commit for the
      # image tags and the cache buster below.
      - name: Resolve the deployed commit
        id: build_info
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=prod-${{ steps.build_info.outputs.head_sha }}
            type=raw,value=prod-latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          target: app_prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_BUSTER=${{ steps.build_info.outputs.head_sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Dokploy webhook
        run: curl -fsSL "${{ secrets.DOKPLOY_DEPLOYMENT_WEBHOOK_PROD }}"

  remove-old-images:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{github.repository_owner}}
          token: ${{secrets.GITHUB_TOKEN}}
          image-names: "hawki"
          image-tags: "prod-* !prod-latest"
          keep-n-most-recent: 5
          cut-off: 1h
